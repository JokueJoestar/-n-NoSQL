services:
  cassandra:
    image: cassandra:4.1
    container_name: errlog-cassandra
    ports: ["9042:9042"]
    environment:
      - MAX_HEAP_SIZE=512M
      - HEAP_NEWSIZE=128M
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
  redis:
    image: redis:7
    container_name: errlog-redis
    ports: ["6379:6379"]
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
